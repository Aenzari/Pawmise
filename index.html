<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    />
    <title>Pawmise 042126</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              bg: "#EAF7FF",
              surface: "#FFFFFF",
              "surface-alt": "#D7F0FF",
              ocean: "#4CAFE5",
              "ocean-deep": "#277EBA",
              text: "#17324D",
              muted: "#66839C",
            },
            fontFamily: {
              display: ['"Baloo 2"', "sans-serif"],
              body: ["Inter", "sans-serif"],
            },
          },
        },
      };
    </script>

    <style>
      body {
        -webkit-tap-highlight-color: transparent;
        background:
          radial-gradient(circle at 15% 0%, #ffffff 0, transparent 34%),
          linear-gradient(180deg, #eaf7ff 0%, #d9f0ff 100%);
      }
      .habitat-glow {
        background:
          radial-gradient(
            circle at 50% 30%,
            rgba(255, 255, 255, 0.85),
            transparent 60%
          ),
          linear-gradient(180deg, #bfe9ff 0%, #8ed4f4 100%);
      }
      .exp-fill {
        background: linear-gradient(90deg, #277eba 0%, #69c9f4 100%);
      }
      .nav-item.active .nav-icon {
        color: #3fa9e0;
      }
      .nav-item.active .nav-label {
        color: #e8f1fb;
      }

      .panel {
        display: none;
      }
      .panel.active {
        display: block;
      }

      #level-up-toast {
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.25s ease,
          transform 0.25s ease;
        transform: translateY(-8px);
      }
      #level-up-toast.show {
        opacity: 1;
        transform: translateY(0);
      }
      @media (prefers-reduced-motion: reduce) {
        #level-up-toast {
          transition: opacity 0.01ms;
          transform: none;
        }
      }

      .task-row.done {
        opacity: 0.5;
      }
      .task-row.done .task-exp {
        color: #3fa9e0;
      }

      .answer-textarea {
        background: #f4fbff;
        border: 1px solid rgba(63, 169, 224, 0.25);
      }
      .answer-textarea:focus {
        outline: none;
        border-color: #3fa9e0;
      }
      .locked-face {
        letter-spacing: 0.05em;
      }
      .reveal-fade {
        animation: revealIn 0.4s ease both;
      }
      @keyframes revealIn {
        from {
          opacity: 0;
          transform: translateY(4px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .reveal-fade {
          animation: none;
        }
      }
    </style>
  </head>

  <body class="bg-bg text-text font-body min-h-screen flex flex-col">
    <!-- Status strip -->
    <header class="flex items-center justify-between px-5 pt-5 pb-3">
      <div class="flex flex-col">
        <span class="text-sm text-muted leading-tight">Pawmise</span>
        <span id="day-label" class="text-base font-medium leading-tight"
          >Day 1</span
        >
      </div>
      <div
        class="flex items-center gap-1.5 bg-surface px-3 py-1.5 rounded-full"
      >
        <span class="text-base leading-none">🔥</span>
        <span id="streak-value" class="font-display font-600 text-sm">1</span>
      </div>
    </header>

    <!-- Main content -->
    <main class="flex-1 px-5 pb-28">
      <!-- Habitat card -->
      <section
        class="habitat-glow rounded-3xl h-72 relative flex items-center justify-center overflow-hidden mt-2"
      >
        <span
          id="level-badge"
          class="absolute top-4 left-4 bg-surface/80 backdrop-blur-sm text-xs font-medium text-muted px-3 py-1 rounded-full"
        >
          Lv. 1
        </span>

        <!-- Level-up toast -->
        <div
          id="level-up-toast"
          class="absolute top-4 right-4 bg-ocean-deep text-text text-xs font-display font-600 px-3 py-1.5 rounded-full"
        >
          Level up!
        </div>

        <!-- 3D Pet Habitat Canvas Container -->
        <div
          id="pet-3d-canvas"
          class="w-full h-full absolute inset-0 flex items-center justify-center cursor-grab active:cursor-grabbing touch-none"
        ></div>

        <!-- Floating Stage Tag over 3D Canvas -->
        <div
          class="absolute bottom-3 bg-surface/80 backdrop-blur px-3 py-1 rounded-full border border-white/5 pointer-events-none"
        >
          <span
            id="pet-stage-name"
            class="text-ocean text-xs font-display font-600"
            >Newborn Pup</span
          >
        </div>
      </section>

      <!-- EXP row -->
      <section class="mt-5">
        <div class="flex items-baseline justify-between mb-2">
          <span id="pet-name" class="font-display font-600 text-lg">Aaron</span>
          <span class="font-display text-sm text-muted">
            <span id="exp-current">0</span> / <span id="exp-max">0</span> EXP
          </span>
        </div>
        <div class="w-full h-3 bg-surface rounded-full overflow-hidden">
          <div
            id="exp-bar"
            class="exp-fill h-full rounded-full transition-[width] duration-500 ease-out"
            style="width: 0%"
          ></div>
        </div>
      </section>

      <!-- Quick stats -->
      <section class="mt-6 grid grid-cols-2 gap-3">
        <div class="bg-surface rounded-2xl px-4 py-3">
          <span class="block text-muted text-xs mb-1">Tasks today</span>
          <span id="stat-tasks-done" class="font-display font-600 text-xl"
            >0 / 0</span
          >
        </div>
        <div class="bg-surface rounded-2xl px-4 py-3">
          <span class="block text-muted text-xs mb-1">Coupons saved</span>
          <span id="stat-coupons" class="font-display font-600 text-xl">0</span>
        </div>
      </section>

      <!-- Tab panels -->
      <section class="mt-6">
        <div id="panel-tasks" class="panel active">
          <div class="flex items-center justify-between mb-3">
            <h2 class="font-display font-600 text-base">Today's tasks</h2>
            <button
              id="add-task-btn"
              class="text-ocean-deep text-sm font-display font-600"
              type="button"
            >
              + Add task
            </button>
          </div>
          <div id="task-list" class="flex flex-col gap-2"></div>
          <form
            id="task-form"
            class="hidden bg-surface rounded-2xl p-4 mt-3 border border-ocean/20"
          >
            <label class="block text-xs text-muted mb-1" for="task-label"
              >Task name</label
            >
            <input
              id="task-label"
              class="w-full rounded-xl px-3 py-2 text-sm"
              required
              maxlength="60"
              placeholder="Plan a sunset walk"
            />
            <label class="block text-xs text-muted mt-3 mb-1" for="task-exp"
              >EXP reward</label
            >
            <input
              id="task-exp"
              class="w-full rounded-xl px-3 py-2 text-sm"
              type="number"
              min="1"
              max="100"
              value="10"
              required
            />
            <div class="flex gap-2 mt-3">
              <button
                class="flex-1 bg-ocean-deep text-white rounded-xl py-2 text-sm font-display font-600"
                type="submit"
              >
                Add task
              </button>
              <button
                id="cancel-task-btn"
                class="px-4 rounded-xl py-2 text-sm text-muted"
                type="button"
              >
                Cancel
              </button>
            </div>
          </form>
        </div>

        <div id="panel-questions" class="panel">
          <h2 class="font-display font-600 text-base mb-1">Daily question</h2>
          <p id="question-prompt" class="text-sm text-text mb-4"></p>

          <div class="flex flex-col gap-3" id="answer-cards"></div>

          <button
            id="reveal-btn"
            class="w-full mt-4 bg-ocean-deep text-text font-display font-600 text-sm py-3 rounded-2xl disabled:opacity-30 disabled:cursor-not-allowed"
          >
            Reveal answers
          </button>

          <button
            id="new-question-btn"
            class="w-full mt-2 text-muted text-xs py-2"
          >
            Ask a different question
          </button>
        </div>

        <div id="panel-rewards" class="panel">
          <!-- Coupon Balance Strip -->
          <div
            class="bg-surface rounded-2xl p-4 flex items-center justify-between mb-5 border border-ocean/20"
          >
            <div>
              <span class="text-xs text-muted block">Spendable Pet Energy</span>
              <div class="flex items-baseline gap-1.5 mt-0.5">
                <span
                  id="spendable-exp-val"
                  class="font-display font-700 text-2xl text-ocean"
                  >0</span
                >
                <span class="text-xs text-muted font-display">EXP</span>
              </div>
            </div>
            <span class="text-2xl">🦴</span>
          </div>

          <!-- Store Section -->
          <div class="mb-6">
            <h3
              class="font-display font-600 text-sm text-muted uppercase tracking-wider mb-3"
            >
              Pawmise Treat Shop
            </h3>
            <form
              id="reward-form"
              class="bg-surface rounded-2xl p-4 mb-3 border border-ocean/20"
            >
              <div class="grid grid-cols-[1fr_72px] gap-2">
                <input
                  id="reward-title"
                  class="rounded-xl px-3 py-2 text-sm"
                  required
                  maxlength="50"
                  placeholder="Add a treat"
                />
                <input
                  id="reward-cost"
                  class="rounded-xl px-3 py-2 text-sm"
                  type="number"
                  min="1"
                  max="999"
                  required
                  placeholder="EXP"
                />
              </div>
              <button
                class="w-full mt-2 bg-ocean-deep text-white rounded-xl py-2 text-sm font-display font-600"
                type="submit"
              >
                Add to shop
              </button>
            </form>
            <div id="coupon-catalog-list" class="flex flex-col gap-2.5"></div>
          </div>

          <!-- Active Coupons Bag -->
          <div>
            <div class="flex items-center justify-between mb-3">
              <h3
                class="font-display font-600 text-sm text-muted uppercase tracking-wider"
              >
                Unused Coupons
              </h3>
              <span id="inventory-count" class="text-xs text-muted font-display"
                >0 active</span
              >
            </div>
            <div id="inventory-list" class="flex flex-col gap-2.5"></div>
          </div>
        </div>
      </section>
    </main>

    <!-- Bottom nav -->
    <nav
      class="fixed bottom-0 inset-x-0 bg-surface border-t border-white/5 px-6 pt-2 pb-[calc(0.5rem+env(safe-area-inset-bottom))]"
    >
      <div class="flex justify-between max-w-md mx-auto">
        <button
          class="nav-item active flex flex-col items-center gap-1 flex-1 py-1"
          data-tab="tasks"
        >
          <span class="nav-icon text-xl text-ocean leading-none">🗓</span>
          <span class="nav-label text-xs font-medium text-text">Tasks</span>
        </button>

        <button
          class="nav-item flex flex-col items-center gap-1 flex-1 py-1"
          data-tab="questions"
        >
          <span class="nav-icon text-xl text-muted leading-none">💬</span>
          <span class="nav-label text-xs font-medium text-muted"
            >Questions</span
          >
        </button>

        <button
          class="nav-item flex flex-col items-center gap-1 flex-1 py-1"
          data-tab="rewards"
        >
          <span class="nav-icon text-xl text-muted leading-none">🎁</span>
          <span class="nav-label text-xs font-medium text-muted">Rewards</span>
        </button>
      </div>
    </nav>

    <script>
      const STORAGE_KEY = "petAppState_v3";

      // Evolution stages by level threshold. Backend will own the source of
      // truth for this in Phase 4; this table is duplicated there.
      const STAGES = [
        { minLevel: 1, name: "Teacup Pup", stageId: 1 },
        { minLevel: 6, name: "Playful Pup", stageId: 2 },
        { minLevel: 15, name: "Full-Grown Dog", stageId: 3 },
      ];

      const DEFAULT_TASKS = [
        { id: "clean", label: "Clean together", exp: 20, done: false },
        { id: "duo", label: "Win a duo match", exp: 30, done: false },
        { id: "walk", label: "Evening walk", exp: 15, done: false },
        { id: "cook", label: "Cook dinner together", exp: 25, done: false },
      ];

      const BACKEND_URL = "https://pawmise-3569.onrender.com"; // or local: http://localhost:5000

      async function newQuestion() {
        const btn = document.getElementById("new-question-btn");
        btn.disabled = true;
        btn.textContent = "Generating question...";

        try {
          const res = await fetch(`${BACKEND_URL}/api/questions/generate`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ category: "romantic" }),
          });
          const data = await res.json();
          if (!res.ok || !data.prompt)
            throw new Error("Question generation failed");

          state.dailyQuestion.prompt = data.prompt;
          state.dailyQuestion.revealed = false;
          state.dailyQuestion.answers.p1 = { text: "", locked: false };
          state.dailyQuestion.answers.p2 = { text: "", locked: false };

          saveState();
          renderQuestion();
        } catch (err) {
          console.error("Failed to get question:", err);
          alert("Unable to load a new question. Check backend connection.");
        } finally {
          btn.disabled = false;
          btn.textContent = "Ask a different question";
        }
      }

      const COUPON_CATALOG = [
        { id: "c_massage", title: "15-Min Massage", cost: 50, icon: "💆" },
        { id: "c_movie", title: "Movie Pick Tonight", cost: 40, icon: "🎬" },
        { id: "c_coffee", title: "Coffee on Me", cost: 30, icon: "☕" },
        { id: "c_dishes", title: "Dishes Pass", cost: 60, icon: "🍽️" },
        { id: "c_snack", title: "Late Night Snack Run", cost: 45, icon: "🍟" },
      ];

      const defaultState = {
        petName: "Aaron",
        level: 1,
        currentExp: 0,
        expToNext: 100,
        spendableExp: 0,
        tasks: DEFAULT_TASKS,
        catalog: COUPON_CATALOG,
        inventory: [],
        usageDates: [],
        lastActiveDate: "",
        dailyQuestion: {
          prompt: "",
          revealed: false,
          answers: {
            p1: { text: "", locked: false },
            p2: { text: "", locked: false },
          },
        },
      };

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return structuredClone(defaultState);
          const parsed = JSON.parse(raw);
          if (!parsed.tasks || !Array.isArray(parsed.tasks))
            throw new Error("bad shape");
          // Backfill any keys added in a later version (e.g. dailyQuestion)
          // so an older saved state doesn't break new panels.
          return {
            ...structuredClone(defaultState),
            ...parsed,
            catalog: parsed.catalog || structuredClone(COUPON_CATALOG),
            usageDates: Array.isArray(parsed.usageDates)
              ? parsed.usageDates
              : [],
            lastActiveDate: parsed.lastActiveDate || "",
          };
        } catch (e) {
          return structuredClone(defaultState);
        }
      }

      function saveState() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      }

      function getStage(level) {
        return (
          [...STAGES].reverse().find((s) => level >= s.minLevel) || STAGES[0]
        );
      }

      let state = loadState();
      let dailyRefreshTimer;

      function getLocalDateKey(date = new Date()) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
      }

      function registerUsage(today) {
        if (!state.usageDates.includes(today)) state.usageDates.push(today);

        let streak = 0;
        const cursor = new Date(`${today}T00:00:00`);
        while (state.usageDates.includes(getLocalDateKey(cursor))) {
          streak += 1;
          cursor.setDate(cursor.getDate() - 1);
        }

        document.getElementById("day-label").textContent =
          `Day ${state.usageDates.length}`;
        document.getElementById("streak-value").textContent = streak;
        saveState();
      }

      async function refreshDailyCycle() {
        const today = getLocalDateKey();
        const isNewDay = state.lastActiveDate && state.lastActiveDate !== today;

        if (isNewDay) {
          state.tasks.forEach((task) => {
            task.done = false;
          });
          state.dailyQuestion = {
            prompt: "",
            revealed: false,
            answers: {
              p1: { text: "", locked: false },
              p2: { text: "", locked: false },
            },
          };
        }

        state.lastActiveDate = today;
        registerUsage(today);
        render();

        if (isNewDay || !state.dailyQuestion.prompt) await newQuestion();
        scheduleDailyRefresh();
      }

      function scheduleDailyRefresh() {
        window.clearTimeout(dailyRefreshTimer);
        const nextMidnight = new Date();
        nextMidnight.setHours(24, 0, 0, 1000);
        dailyRefreshTimer = window.setTimeout(
          () => refreshDailyCycle(),
          nextMidnight.getTime() - Date.now(),
        );
      }

      function addExp(amount) {
        state.spendableExp = Math.max(0, (state.spendableExp || 0) + amount);

        state.currentExp = Math.max(0, state.currentExp + amount);
        let leveledUp = false;

        while (state.currentExp >= state.expToNext) {
          state.currentExp -= state.expToNext;
          state.level += 1;
          state.expToNext = Math.round(state.expToNext * 1.15);
          leveledUp = true;
        }

        saveState();
        render();
        if (leveledUp) showLevelUpToast();
      }

      function toggleTask(taskId) {
        const task = state.tasks.find((t) => t.id === taskId);
        if (!task) return;

        task.done = !task.done;
        addExp(task.done ? task.exp : -task.exp);
      }

      function showLevelUpToast() {
        const toast = document.getElementById("level-up-toast");
        toast.textContent = `Level up! Lv. ${state.level}`;
        toast.classList.add("show");
        window.setTimeout(() => toast.classList.remove("show"), 1800);
      }

      function renderPet() {
        const stage = getStage(state.level);
        document.getElementById("pet-stage-name").textContent = stage.name;
        document.getElementById("pet-name").textContent = state.petName;
        document.getElementById("level-badge").textContent =
          `Lv. ${state.level}`;

        // Check if we need to rebuild the model for a major evolution stage
        const expectedStage = state.level >= 15 ? 3 : state.level >= 6 ? 2 : 1;
        if (currentRenderedStage !== expectedStage) {
          buildShihTzu(state.level);
        }

        // Smooth micro-growth for levels within the same stage
        if (dogGroup) {
          const microScale = 1.0 + (state.level % 5) * 0.02;
          dogGroup.scale.set(microScale, microScale, microScale);
        }
      }

      function renderExpBar() {
        document.getElementById("exp-current").textContent = state.currentExp;
        document.getElementById("exp-max").textContent = state.expToNext;
        const pct = Math.min(
          100,
          Math.round((state.currentExp / state.expToNext) * 100),
        );
        document.getElementById("exp-bar").style.width = `${pct}%`;
      }

      function renderTasks() {
        const list = document.getElementById("task-list");
        list.innerHTML = "";

        state.tasks.forEach((task) => {
          const row = document.createElement("button");
          row.className = `task-row flex items-center justify-between bg-surface rounded-2xl px-4 py-3 w-full text-left ${task.done ? "done" : ""}`;
          row.setAttribute("data-task-id", task.id);
          row.innerHTML = `
          <span class="flex items-center gap-3">
            <span class="w-5 h-5 rounded-full border border-ocean/40 flex items-center justify-center text-xs ${task.done ? "bg-ocean border-ocean" : ""}">
              ${task.done ? "✓" : ""}
            </span>
            <span class="text-sm">${escapeHTML(task.label)}</span>
          </span>
          <span class="task-exp font-display text-sm text-muted">+${task.exp}</span>
        `;
          row.addEventListener("click", () => toggleTask(task.id));
          list.appendChild(row);
        });

        const doneCount = state.tasks.filter((t) => t.done).length;
        document.getElementById("stat-tasks-done").textContent =
          `${doneCount} / ${state.tasks.length}`;
      }

      function lockAnswer(slot) {
        const q = state.dailyQuestion;
        const textarea = document.querySelector(
          `[data-answer-input="${slot}"]`,
        );
        const value = textarea.value.trim();
        if (!value) return;

        q.answers[slot].text = value;
        q.answers[slot].locked = true;
        saveState();
        renderQuestion();
      }

      function revealAnswers() {
        const q = state.dailyQuestion;
        if (!q.answers.p1.locked || !q.answers.p2.locked) return;
        q.revealed = true;
        saveState();
        renderQuestion();
      }

      function answerCardHTML(slot, label, answer, revealed) {
        if (revealed) {
          return `
          <div class="bg-surface rounded-2xl px-4 py-3 reveal-fade">
            <span class="block text-muted text-xs mb-1">${escapeHTML(label)}</span>
            <p class="text-sm">${escapeHTML(answer.text)}</p>
          </div>
        `;
        }

        if (answer.locked) {
          return `
          <div class="bg-surface rounded-2xl px-4 py-3 flex items-center justify-between">
            <span class="text-muted text-xs">${label}</span>
            <span class="locked-face text-xs text-ocean">Answer locked 🔒</span>
          </div>
        `;
        }

        return `
        <div class="bg-surface rounded-2xl px-4 py-3">
            <span class="block text-muted text-xs mb-2">${escapeHTML(label)}</span>
          <textarea data-answer-input="${slot}" rows="2" placeholder="Type your answer, then lock it in…"
            class="answer-textarea w-full rounded-xl px-3 py-2 text-sm text-text placeholder:text-muted resize-none"></textarea>
          <button data-lock-btn="${slot}" class="mt-2 text-xs font-medium text-ocean">Lock in answer</button>
        </div>
      `;
      }

      function renderQuestion() {
        const q = state.dailyQuestion;
        document.getElementById("question-prompt").textContent = q.prompt;

        const container = document.getElementById("answer-cards");
        container.innerHTML =
          answerCardHTML("p1", "Partner 1", q.answers.p1, q.revealed) +
          answerCardHTML("p2", "Partner 2", q.answers.p2, q.revealed);

        container.querySelectorAll("[data-lock-btn]").forEach((btn) => {
          btn.addEventListener("click", () =>
            lockAnswer(btn.getAttribute("data-lock-btn")),
          );
        });

        const bothLocked = q.answers.p1.locked && q.answers.p2.locked;
        const revealBtn = document.getElementById("reveal-btn");
        revealBtn.disabled = !bothLocked || q.revealed;
        revealBtn.textContent = q.revealed ? "Revealed" : "Reveal answers";

        document.getElementById("new-question-btn").classList.remove("hidden");
      }

      document
        .getElementById("reveal-btn")
        .addEventListener("click", revealAnswers);
      document
        .getElementById("new-question-btn")
        .addEventListener("click", newQuestion);

      function render() {
        renderPet();
        renderExpBar();
        renderTasks();
        renderQuestion();
      }

      function escapeHTML(value) {
        return String(value).replace(/[&<>"]/g, (character) => {
          const entities = {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
          };
          return entities[character];
        });
      }

      function addTask(event) {
        event.preventDefault();
        const label = document.getElementById("task-label").value.trim();
        const exp = Number(document.getElementById("task-exp").value);
        if (!label || !Number.isInteger(exp) || exp < 1) return;

        state.tasks.push({
          id: `task_${Date.now()}`,
          label,
          exp,
          done: false,
        });
        saveState();
        event.target.reset();
        document.getElementById("task-exp").value = 10;
        document.getElementById("task-form").classList.add("hidden");
        renderTasks();
      }

      function addReward(event) {
        event.preventDefault();
        const title = document.getElementById("reward-title").value.trim();
        const cost = Number(document.getElementById("reward-cost").value);
        if (!title || !Number.isInteger(cost) || cost < 1) return;

        state.catalog.push({
          id: `c_${Date.now()}`,
          title,
          cost,
          icon: "🎁",
        });
        saveState();
        event.target.reset();
        renderRewards();
      }

      // Tab switching
      document.querySelectorAll(".nav-item").forEach((btn) => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".nav-item").forEach((b) => {
            b.classList.remove("active");
            b.querySelector(".nav-icon").classList.replace(
              "text-ocean",
              "text-muted",
            );
            b.querySelector(".nav-label").classList.replace(
              "text-text",
              "text-muted",
            );
          });
          btn.classList.add("active");
          btn
            .querySelector(".nav-icon")
            .classList.replace("text-muted", "text-ocean");
          btn
            .querySelector(".nav-label")
            .classList.replace("text-muted", "text-text");

          const tab = btn.getAttribute("data-tab");
          document
            .querySelectorAll(".panel")
            .forEach((p) => p.classList.remove("active"));
          document.getElementById(`panel-${tab}`).classList.add("active");
        });
      });

      document.getElementById("add-task-btn").addEventListener("click", () => {
        document.getElementById("task-form").classList.toggle("hidden");
      });
      document
        .getElementById("cancel-task-btn")
        .addEventListener("click", () => {
          document.getElementById("task-form").classList.add("hidden");
        });
      document.getElementById("task-form").addEventListener("submit", addTask);
      document
        .getElementById("reward-form")
        .addEventListener("submit", addReward);

      // Ensure state backfill for older local saves
      if (state.spendableExp === undefined)
        state.spendableExp = state.currentExp;
      if (!state.inventory) state.inventory = [];

      function buyCoupon(couponId) {
        const item = state.catalog.find((c) => c.id === couponId);
        if (!item || state.spendableExp < item.cost) return;

        state.spendableExp -= item.cost;
        state.inventory.unshift({
          instanceId: "inst_" + Date.now(),
          couponId: item.id,
          title: item.title,
          icon: item.icon,
          redeemedAt: new Date().toLocaleDateString("en-US", {
            month: "short",
            day: "numeric",
          }),
          used: false,
        });

        saveState();
        renderRewards();
        triggerPetReaction("BONE"); // Visual feedback
      }

      function useCoupon(instanceId) {
        const item = state.inventory.find((i) => i.instanceId === instanceId);
        if (!item) return;

        item.used = true;
        saveState();
        renderRewards();
        triggerPetReaction("HEART");
      }

      function triggerPetReaction(type) {
        const toast = document.getElementById("level-up-toast");
        toast.textContent =
          type === "BONE" ? "🦴 Coupon Bought!" : "💖 Coupon Redeemed!";
        toast.classList.add("show");
        window.setTimeout(() => toast.classList.remove("show"), 1500);
      }

      function renderRewards() {
        document.getElementById("spendable-exp-val").textContent =
          state.spendableExp || 0;

        // Render Catalog
        const catalogList = document.getElementById("coupon-catalog-list");
        catalogList.innerHTML = "";

        state.catalog.forEach((coupon) => {
          const canAfford = (state.spendableExp || 0) >= coupon.cost;
          const itemEl = document.createElement("div");
          itemEl.className =
            "bg-surface rounded-2xl px-4 py-3 flex items-center justify-between border border-white/5";
          itemEl.innerHTML = `
      <div class="flex items-center gap-3">
          <span class="text-2xl">${escapeHTML(coupon.icon)}</span>
        <div>
          <span class="text-sm font-medium block">${escapeHTML(coupon.title)}</span>
          <span class="text-xs text-muted">${coupon.cost} EXP</span>
        </div>
      </div>
      <button 
        data-buy-id="${coupon.id}"
        class="text-xs font-display font-600 px-3 py-1.5 rounded-xl border transition ${
          canAfford
            ? "bg-ocean-deep border-ocean text-text hover:bg-ocean"
            : "border-slate-700 text-muted opacity-40 cursor-not-allowed"
        }"
        ${!canAfford ? "disabled" : ""}>
        Claim
      </button>
    `;
          itemEl
            .querySelector("[data-buy-id]")
            ?.addEventListener("click", () => buyCoupon(coupon.id));
          catalogList.appendChild(itemEl);
        });

        // Render Active Inventory
        const inventoryList = document.getElementById("inventory-list");
        const activeItems = state.inventory.filter((i) => !i.used);
        document.getElementById("inventory-count").textContent =
          `${activeItems.length} active`;
        document.getElementById("stat-coupons").textContent =
          activeItems.length;
        inventoryList.innerHTML = "";

        if (activeItems.length === 0) {
          inventoryList.innerHTML = `
      <div class="bg-surface/50 rounded-2xl p-6 text-center border border-dashed border-slate-800">
        <p class="text-xs text-muted">No claimed coupons yet. Earn EXP by completing tasks!</p>
      </div>
    `;
          return;
        }

        activeItems.forEach((item) => {
          const card = document.createElement("div");
          card.className =
            "bg-surface-alt rounded-2xl px-4 py-3 flex items-center justify-between border border-ocean/30";
          card.innerHTML = `
      <div class="flex items-center gap-3">
        <span class="text-2xl">${escapeHTML(item.icon)}</span>
        <div>
          <span class="text-sm font-medium block">${escapeHTML(item.title)}</span>
          <span class="text-[11px] text-muted">Claimed ${item.redeemedAt}</span>
        </div>
      </div>
      <button 
        data-use-id="${item.instanceId}"
        class="text-xs font-display font-600 bg-emerald-600/80 hover:bg-emerald-600 text-white px-3 py-1.5 rounded-xl transition">
        Use Now
      </button>
    `;
          card
            .querySelector("[data-use-id]")
            .addEventListener("click", () => useCoupon(item.instanceId));
          inventoryList.appendChild(card);
        });
      }

      // Hook renderRewards into master render()
      const baseRender = render;
      render = function () {
        baseRender();
        renderRewards();
      };

      // --- Three.js Dynamic Shih Tzu Setup ---
      const canvasContainer = document.getElementById("pet-3d-canvas");
      let scene, camera, renderer, dogGroup, dogHead, dogTail;
      let currentRenderedStage = null;
      let isDragging = false,
        previousX = 0;

      function init3DPet() {
        const width = canvasContainer.clientWidth;
        const height = canvasContainer.clientHeight;

        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 100);
        camera.position.set(0, 1.2, 4.4);

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(width, height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        canvasContainer.appendChild(renderer.domElement);

        // Soft Lighting
        const ambient = new THREE.AmbientLight(0xffffff, 0.85);
        scene.add(ambient);

        const keyLight = new THREE.DirectionalLight(0xbae0fd, 1.2);
        keyLight.position.set(4, 6, 4);
        scene.add(keyLight);

        const fillLight = new THREE.DirectionalLight(0xffedd5, 0.5);
        fillLight.position.set(-4, 3, -2);
        scene.add(fillLight);

        // Build the initial model based on state
        buildShihTzu(state.level);

        // Drag-to-Rotate Events
        const onPointerDown = (e) => {
          isDragging = true;
          previousX = e.clientX || (e.touches && e.touches[0].clientX);
        };
        const onPointerMove = (e) => {
          if (!isDragging) return;
          const clientX = e.clientX || (e.touches && e.touches[0].clientX);
          const delta = clientX - previousX;
          if (dogGroup) dogGroup.rotation.y += delta * 0.012;
          previousX = clientX;
        };
        const onPointerUp = () => {
          isDragging = false;
        };

        canvasContainer.addEventListener("mousedown", onPointerDown);
        window.addEventListener("mousemove", onPointerMove);
        window.addEventListener("mouseup", onPointerUp);

        canvasContainer.addEventListener("touchstart", onPointerDown, {
          passive: true,
        });
        window.addEventListener("touchmove", onPointerMove, { passive: true });
        window.addEventListener("touchend", onPointerUp);

        window.addEventListener("resize", () => {
          if (!canvasContainer) return;
          const w = canvasContainer.clientWidth;
          const h = canvasContainer.clientHeight;
          camera.aspect = w / h;
          camera.updateProjectionMatrix();
          renderer.setSize(w, h);
        });

        animate3DPet();
      }

      function buildShihTzu(level) {
        const isBaby = level < 6; // Lv 1 - 5
        const isTeen = level >= 6 && level < 15; // Lv 6 - 14
        const isAdult = level >= 15; // Lv 15+

        const newStage = isAdult ? 3 : isTeen ? 2 : 1;
        currentRenderedStage = newStage;

        if (dogGroup) scene.remove(dogGroup);
        dogGroup = new THREE.Group();

        // Materials
        const creamMat = new THREE.MeshLambertMaterial({ color: 0xfbf8f1 });
        const patchMat = new THREE.MeshLambertMaterial({ color: 0x4a3b32 }); // Dark brown spots
        const noseMat = new THREE.MeshBasicMaterial({ color: 0x111827 });
        const tongueMat = new THREE.MeshLambertMaterial({ color: 0xf472b6 });
        const bandMat = new THREE.MeshLambertMaterial({ color: 0x38bdf8 }); // Ocean blue band

        // 1. Torso (Smaller stubby body for baby, longer for adult)
        const bodyRadius = isBaby ? 0.5 : isTeen ? 0.65 : 0.78;
        const bodyGeo = new THREE.SphereGeometry(bodyRadius, 16, 16);
        const body = new THREE.Mesh(bodyGeo, creamMat);
        body.scale.set(1.0, isBaby ? 0.9 : 0.85, isBaby ? 1.05 : 1.3);
        body.position.set(0, isBaby ? 0.25 : 0.35, 0);
        dogGroup.add(body);

        // Spot patch on back
        const patchGeo = new THREE.SphereGeometry(bodyRadius * 0.55, 12, 12);
        const backPatch = new THREE.Mesh(patchGeo, patchMat);
        backPatch.scale.set(1.1, 0.6, 1.1);
        backPatch.position.set(0.1, body.position.y + bodyRadius * 0.45, -0.1);
        dogGroup.add(backPatch);

        // 2. Head Group
        dogHead = new THREE.Group();
        const headY = isBaby ? 0.85 : isTeen ? 1.05 : 1.15;
        dogHead.position.set(0, headY, isBaby ? 0.2 : 0.35);

        // Baby has larger head relative to body (bobble-head effect)
        const headRadius = isBaby ? 0.48 : isTeen ? 0.54 : 0.6;
        const headGeo = new THREE.SphereGeometry(headRadius, 16, 16);
        const head = new THREE.Mesh(headGeo, creamMat);
        dogHead.add(head);

        // Shih Tzu Snout Beard / Mustache Tuft
        if (!isBaby) {
          const beardGeo = new THREE.ConeGeometry(
            0.18,
            isAdult ? 0.38 : 0.25,
            8,
          );
          const beard = new THREE.Mesh(beardGeo, creamMat);
          beard.rotation.x = 0.3;
          beard.position.set(0, -0.2, headRadius * 0.9);
          dogHead.add(beard);
        }

        // Eye Patches & Eyes
        const patchScale = isBaby ? 0.18 : 0.23;
        const eyePatchGeo = new THREE.SphereGeometry(patchScale, 12, 12);
        const leftPatch = new THREE.Mesh(eyePatchGeo, patchMat);
        leftPatch.scale.set(0.8, 1, 0.4);
        leftPatch.position.set(-headRadius * 0.42, 0.08, headRadius * 0.78);
        const rightPatch = leftPatch.clone();
        rightPatch.position.x = headRadius * 0.42;
        dogHead.add(leftPatch);
        dogHead.add(rightPatch);

        const eyeGeo = new THREE.SphereGeometry(0.062, 8, 8);
        const leftEye = new THREE.Mesh(eyeGeo, noseMat);
        leftEye.position.set(-headRadius * 0.4, 0.08, headRadius * 0.94);
        const rightEye = leftEye.clone();
        rightEye.position.x = headRadius * 0.4;
        dogHead.add(leftEye);
        dogHead.add(rightEye);

        // Snout & Button Nose
        const snoutGeo = new THREE.SphereGeometry(isBaby ? 0.14 : 0.18, 12, 12);
        const snout = new THREE.Mesh(snoutGeo, creamMat);
        snout.scale.set(1.2, 0.8, 1.0);
        snout.position.set(0, -0.05, headRadius * 0.95);
        dogHead.add(snout);

        const noseGeo = new THREE.SphereGeometry(0.05, 8, 8);
        const nose = new THREE.Mesh(noseGeo, noseMat);
        nose.position.set(0, 0.02, headRadius * 1.15);
        dogHead.add(nose);

        // Tongue
        const tongueGeo = new THREE.BoxGeometry(0.06, 0.07, 0.02);
        const tongue = new THREE.Mesh(tongueGeo, tongueMat);
        tongue.position.set(0, -0.12, headRadius * 1.05);
        tongue.rotation.x = 0.2;
        dogHead.add(tongue);

        // Ears: Baby has short floppy ears, Teen/Adult have long flowy ears
        const earLength = isBaby ? 0.42 : isTeen ? 0.65 : 0.85;
        const earGeo = new THREE.CylinderGeometry(0.12, 0.2, earLength, 10);
        const leftEar = new THREE.Mesh(earGeo, patchMat);
        leftEar.position.set(-headRadius * 0.9, -0.05, 0);
        leftEar.rotation.z = -0.22;
        const rightEar = new THREE.Mesh(earGeo, patchMat);
        rightEar.position.set(headRadius * 0.9, -0.05, 0);
        rightEar.rotation.z = 0.22;
        dogHead.add(leftEar);
        dogHead.add(rightEar);

        // Cheek Fur Tufts (Only grows out on Teen & Adult stages)
        if (!isBaby) {
          const cheekScale = isAdult ? 0.65 : 0.45;
          const cheekGeo = new THREE.ConeGeometry(0.24, cheekScale, 8);
          const leftCheek = new THREE.Mesh(cheekGeo, creamMat);
          leftCheek.rotation.z = 1.1;
          leftCheek.position.set(-headRadius * 0.85, -0.15, 0.2);
          const rightCheek = new THREE.Mesh(cheekGeo, creamMat);
          rightCheek.rotation.z = -1.1;
          rightCheek.position.set(headRadius * 0.85, -0.15, 0.2);
          dogHead.add(leftCheek);
          dogHead.add(rightCheek);
        }

        // Topknot Bun (Appears at Level 6, fully styled at Level 15)
        if (!isBaby) {
          const hairTieGeo = new THREE.TorusGeometry(0.08, 0.03, 8, 16);
          const hairTie = new THREE.Mesh(hairTieGeo, bandMat);
          hairTie.rotation.x = Math.PI / 2;
          hairTie.position.set(0, headRadius * 0.98, 0.05);
          dogHead.add(hairTie);

          const knotSize = isAdult ? 0.17 : 0.12;
          const topknotGeo = new THREE.SphereGeometry(knotSize, 10, 10);
          const topknot = new THREE.Mesh(topknotGeo, creamMat);
          topknot.scale.set(0.9, 1.2, 0.8);
          topknot.position.set(0, headRadius * 1.15, 0.05);
          dogHead.add(topknot);
        }

        dogGroup.add(dogHead);

        // 3. Tail: Baby has a short wagging tail, Adult has full curled plume
        dogTail = new THREE.Group();
        dogTail.position.set(0, body.position.y + 0.2, -bodyRadius * 0.9);

        if (isBaby) {
          const babyTailGeo = new THREE.CylinderGeometry(0.04, 0.07, 0.35, 8);
          const bTail = new THREE.Mesh(babyTailGeo, patchMat);
          bTail.rotation.x = -Math.PI / 3;
          dogTail.add(bTail);
        } else {
          const tailTorusGeo = new THREE.TorusGeometry(
            0.26,
            0.07,
            8,
            16,
            Math.PI * 1.1,
          );
          const plume = new THREE.Mesh(tailTorusGeo, patchMat);
          plume.rotation.y = Math.PI / 2;
          plume.rotation.z = 0.3;
          dogTail.add(plume);

          const fluffGeo = new THREE.SphereGeometry(0.14, 8, 8);
          const fluff = new THREE.Mesh(fluffGeo, creamMat);
          fluff.position.set(0, 0.25, 0.12);
          dogTail.add(fluff);
        }
        dogGroup.add(dogTail);

        // 4. Paws
        const pawHeight = isBaby ? 0.22 : 0.35;
        const pawGeo = new THREE.CylinderGeometry(0.11, 0.14, pawHeight, 10);
        const flPaw = new THREE.Mesh(pawGeo, creamMat);
        flPaw.position.set(
          -bodyRadius * 0.45,
          -bodyRadius * 0.4,
          bodyRadius * 0.45,
        );
        const frPaw = flPaw.clone();
        frPaw.position.x = bodyRadius * 0.45;
        const blPaw = flPaw.clone();
        blPaw.position.set(
          -bodyRadius * 0.45,
          -bodyRadius * 0.4,
          -bodyRadius * 0.45,
        );
        const brPaw = flPaw.clone();
        brPaw.position.x = bodyRadius * 0.45;

        dogGroup.add(flPaw);
        dogGroup.add(frPaw);
        dogGroup.add(blPaw);
        dogGroup.add(brPaw);

        scene.add(dogGroup);
      }

      // Animation loop
      const clock = new THREE.Clock();
      function animate3DPet() {
        requestAnimationFrame(animate3DPet);
        const elapsed = clock.getElapsedTime();

        if (dogGroup && dogHead && dogTail) {
          // Puppies wag faster than adult dogs
          const wagSpeed = state.level < 6 ? 11.0 : 7.5;
          dogGroup.position.y = Math.sin(elapsed * 2.4) * 0.04;
          dogHead.rotation.z = Math.sin(elapsed * 1.6) * 0.03;
          dogTail.rotation.x = Math.sin(elapsed * wagSpeed) * 0.25;

          if (!isDragging) {
            dogGroup.rotation.y = Math.sin(elapsed * 0.5) * 0.15;
          }
        }

        renderer.render(scene, camera);
      }

      // Initialize the scene before rendering state-dependent pet updates.
      window.addEventListener("DOMContentLoaded", () => {
        init3DPet();
        refreshDailyCycle();
      });
    </script>
  </body>
</html>
